monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Jieli_Technology.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.ignore-dB = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Jieli_Technology.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.ignore-dB = true
      }
    }
  }
]
