# VARIABLES
$wall = ~/.cache/matugen/lightdm/wall.png

background {
    monitor =
    path = $wall
    blur_passes = 0
    blur_size = 0
    noise = 0
}

# CLOCK (12-hour)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = rgba({{colors.on_background.default.hex_stripped}}ff)
    font_size = 65
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 300
    halign = center
    valign = center
}

# SUBTEXT
label {
    monitor =
    text = haiii twiggy :3
    color = rgba({{colors.on_background.default.hex_stripped}}ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 230
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1
    outer_color = rgba({{colors.primary.default.hex_stripped}}ff)
    inner_color = rgba({{colors.surface_container.default.hex_stripped}}ff)
    font_color = rgba({{colors.on_background.default.hex_stripped}}ff)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    check_color = rgba({{colors.tertiary.default.hex_stripped}}ff)
    fail_color = rgba({{colors.error.default.hex_stripped}}ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = 1
    numlock_color = 1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = true
    position = 0, -350
    halign = center
    valign = center
}
