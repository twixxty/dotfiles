# Vicinae Theme - generated by matugen

[meta]
name = "Matugen Generated"
description = "Dynamic theme generated from current wallpaper"
variant = "dark"
inherits = "vicinae-dark"

# ============================================================================
# Core Colors
# ============================================================================

[colors.core]
accent = "#ecc06c"
accent_foreground = "#412d00"
background = "#17130b"
foreground = "#ebe1d4"
secondary_background = "#241f17"
border = "#4e4639"

# ============================================================================
# Window-Specific Colors
# ============================================================================

[colors.main_window]
border = "#4e4639"

[colors.settings_window]
border = "#4e4639"

# ============================================================================
# Accent Colors
# ============================================================================

[colors.accents]
blue = "#ecc06c"
green = "#b2cfa7"
magenta = "#d9c4a0"
orange = "#354d2f"
red = "#ffb4ab"
yellow = "#354d2f"
cyan = "#53452a"
purple = "#d9c4a0"

# ============================================================================
# Text Colors
# ============================================================================

[colors.text]
default = "#ebe1d4"
muted = "#d1c5b4"
danger = "#ffb4ab"
success = "#b2cfa7"
placeholder = "#9a8f80"
selection = { background = "#5d4200", foreground = "#ffdea5" }

[colors.text.links]
default = "#ecc06c"
visited = "#d9c4a0"

# ============================================================================
# Input Fields
# ============================================================================

[colors.input]
border = "#4e4639"
border_focus = "#ecc06c"
border_error = "#ffb4ab"

# ============================================================================
# Buttons
# ============================================================================

[colors.button.primary]
background = "#5d4200"
foreground = "#ffdea5"
hover = { background = "#53452a" }
focus = { outline = "#ecc06c" }

# ============================================================================
# Lists
# ============================================================================

[colors.list.item.hover]
background = "#2f2921"
foreground = "#ebe1d4"

[colors.list.item.selection]
background = "#5d4200"
foreground = "#ffdea5"
secondary_background = "#53452a"
secondary_foreground = "#f6e0bb"

# ============================================================================
# Grid Items
# ============================================================================

[colors.grid.item]
background = "#241f17"
hover = { outline = "#9a8f80" }
selection = { outline = "#ecc06c" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = "#3a342b"

# ============================================================================
# Loading Indicators
# ============================================================================

[colors.loading]
bar = "#ecc06c"
spinner = "#ecc06c"
